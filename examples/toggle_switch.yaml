# Gardner toggle switch — mutual Hill repression
# A classic bistable genetic circuit with two repressors.
name: user_toggle_switch
description: Mutual Hill repression with tunable cooperativity

states: [x1, x2]

parameters:
  - name: a1
    bounds: [2.0, 5.0]
  - name: a2
    bounds: [2.0, 5.0]

# dx1/dt = a1 / (1 + x2^2) - x1
# dx2/dt = a2 / (1 + x1^2) - x2
equations:
  - "a1 / (1 + x2**2) - x1"
  - "a2 / (1 + x1**2) - x2"

state_domain:
  - [0.1, 5.0]
  - [0.1, 5.0]

rhs_type: hill
expected_regimes: [bistable, monostable]
